[fmt]
# Leave code in Markdown fences alone: a fenced snippet is quoted, and
# formatting it would change what it quotes.
embeddedLanguageFormatting = "off"
ignorePatterns = [
  # The varnamelen ignore list is a YAML flow sequence with comments grouping the
  # names into three annotated categories -- which is how anyone adding a
  # one-letter name knows where to put it. bun fmt explodes a flow sequence to
  # one entry per line, and the grouping stops meaning anything.
  ".golangci.yml",

  # Local scratch: .planning/ is written by release-captain. bun fmt reads this
  # repo's .gitignore but not the global core.excludesfile, which is where it is
  # ignored -- so git hides it and bun fmt would not. Without this line the gate
  # fails on files the repository does not carry.
  ".planning/**",
]
